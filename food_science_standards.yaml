domain: food_science
version: "2026.10.21-1"
policy:
  precedence:
    - BPOM
    - SNI_BSN
    - KBBI
    - Codex_ISO_reference
    - contextual_mapping
  note: >-
    Istilah locked dipakai sebagai padanan Indonesia yang telah diverifikasi dari nomenklatur
    BPOM/SNI atau istilah Indonesia yang sangat mapan. Codex/ISO dipakai untuk mencocokkan
    konsep Inggris dengan kategori/istilah Indonesia, bukan untuk menggantikan ketentuan Indonesia.
