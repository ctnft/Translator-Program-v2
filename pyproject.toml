[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "translator-program"
version = "0.2.2"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.2",
    "httpx>=0.28",
    "pywin32>=312; sys_platform == 'win32'"
]

[project.optional-dependencies]
test = ["pytest>=9.0", "pytest-cov>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
